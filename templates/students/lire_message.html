{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">✉️ {{ msg.sujet }}</h1>
    <div class="page-subtitle">De : {{ msg.expediteur.username }} — {{ msg.date_envoi|date:"d/m/Y à H:i" }}</div>
  </div>
  <a class="btn btn-secondary" href="{% url 'messagerie' %}">← Retour</a>
</div>
<div class="card" style="max-width:700px;">
  <div style="white-space:pre-wrap; line-height:1.8; color:var(--text);">{{ msg.contenu }}</div>
</div>
{% endblock %}

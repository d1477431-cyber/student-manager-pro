<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager Pro</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --surface: rgba(255, 255, 255, 0.94);
            --surface-strong: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #4f46e5;
            --primary-2: #7c3aed;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
            color: var(--text);
        }
        .navbar {
            background: linear-gradient(90deg, #111827 0%, #1f2937 100%);
            color: white;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.16);
        }
        .brand {
            font-weight: 800;
            letter-spacing: 0.04em;
            font-size: 1.05rem;
        }
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 999px;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .nav-links a:hover {
            background: rgba(255,255,255,0.14);
            transform: translateY(-1px);
        }
        .container {
            max-width: 1220px;
            margin: 28px auto 42px;
            padding: 0 20px 24px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0;
            color: #111827;
        }
        .page-subtitle { color: var(--muted); margin-top: 6px; }
        .card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
            padding: 24px;
            backdrop-filter: blur(12px);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px 18px;
        }
        .stat-card .label { color: var(--muted); font-size: 0.9rem; }
        .stat-card strong { display: block; font-size: 1.25rem; margin-top: 6px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; overflow: hidden; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
        th {
            text-align: left;
            font-weight: 700;
            color: white;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-2) 100%);
        }
        tbody tr:hover { background: #f8fafc; }
        a.button, button {
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-2) 100%);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 11px 16px;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.20);
        }
        a.button:hover, button:hover { transform: translateY(-1px); }
        .button-secondary { background: #64748b; box-shadow: none; }
        .button-danger { background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%); box-shadow: none; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; color: #334155; }
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 1rem;
            background: #fbfdff;
            color: var(--text);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }
        textarea { min-height: 120px; resize: vertical; }
        .flash {
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 18px;
            border: 1px solid transparent;
        }
        .flash-success { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
        .flash-error { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
        .login-shell {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 22px;
            align-items: center;
        }
        .hero-panel {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hero-panel h1 { font-size: 2rem; margin-bottom: 10px; }
        .hero-panel p { opacity: 0.9; line-height: 1.7; }
        .hero-badge {
            display: inline-block;
            width: fit-content;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.18);
            margin-bottom: 12px;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
        @media (max-width: 900px) {
            .login-shell { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="brand">Student Manager Pro</div>
        <div class="nav-links">
            <a href="{% url 'index' %}">Accueil</a>
            <a href="{% url 'add_student' %}">Ajouter</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}">Déconnexion</a>
            {% else %}
                <a href="{% url 'login' %}">Connexion</a>
            {% endif %}
        </div>
    </div>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="flash flash-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
